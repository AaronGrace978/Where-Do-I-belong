[package]
name = "where-do-i-belong"
version = "1.0.0"
description = "A globe and compass for finding your people"
authors = ["Aaron Grace"]
edition = "2021"
license = "LicenseRef-Proprietary"
repository = "https://github.com/AaronGrace978/Where-Do-I-belong"
homepage = "https://github.com/AaronGrace978/Where-Do-I-belong"

[lib]
name = "tauri_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-store = "2.4.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
futures-util = "0.3.34"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros"] }
uuid = { version = "1.26.0", features = ["v4", "serde"] }
reqwest = { version = "0.13.4", default-features = false, features = ["json", "stream", "native-tls"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
